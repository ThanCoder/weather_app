name: weather
description: "my weather app"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  location: ^8.0.0
  t_client:
    git:
      url: https://github.com/ThanCoder/t_client
  dart_core_extensions:
    git:
      url: https://github.com/ThanCoder/dart_core_extensions.git
  t_widgets:
    git:
      url: https://github.com/ThanCoder/t_widgets.git
  than_pkg_android: ^0.6.1

# flutter pub upgrade dart_core_extensions t_widgets t_client

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  # dart run change_app_package_name:main [com.new.package.name]
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  # dart run flutter_launcher_icons
  android: "launcher_icon"
  image_path: "assets/logo/logo.png"
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
  - assets/logo/
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
